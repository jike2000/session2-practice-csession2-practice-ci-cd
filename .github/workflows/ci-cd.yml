name: Train and release linear model

on:
  push:
    branches: [main]
    paths: [training_data.csv]
  pull_request:
    branches: [main]
    paths: [training_data.csv]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    name: Train model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train linear regression
        run: python train_model.py
      - name: Upload model coefficients
        uses: actions/upload-artifact@v4
        with:
          name: model-coefficients
          path: linear_model.txt
          if-no-files-found: error

  publish:
    name: Publish model
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: model-coefficients
          path: ${{ runner.temp }}/model
      - name: Update release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git switch --track origin/release
          else
            git switch --orphan release
          fi

          cp "$RUNNER_TEMP/model/linear_model.txt" linear_model.txt
          git add linear_model.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update model for v$GITHUB_RUN_NUMBER"
            git push origin HEAD:refs/heads/release
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$GITHUB_RUN_NUMBER"
          model_file="$RUNNER_TEMP/model/linear_model.txt"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$model_file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$model_file" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Release $tag" \
              --notes 'Linear regression coefficients generated from training_data.csv.'
          fi
